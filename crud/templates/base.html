<html>
    <head>
        <title>{% block title %}{% endblock %}</title>
        {% load static %}
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <header>
            <img src="{% static 'images/logo.jpg' %}" alt="Logo">
            <h1>My Blog</h1>
            {% include 'navbar.html' %}
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>&copy; 2024 My Blog. All rights reserved.</p>
        </footer>
    </body>
    <script src="{% static 'js/scripts.js' %}"></script>
</html>
